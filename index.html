<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sri Vengamamba Food Court - POS & Analytics</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#FFD700">
  <meta name="description" content="Sri Vengamamba Food Court Billing Portal – Chinese Kitchen / Juice Bar">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SVFC POS">
  <link rel="apple-touch-icon" href="/static/app_icon.png">
  <link rel="manifest" href="/manifest.json">

  <!-- Critical inline CSS: ensures dark background shows INSTANTLY before stylesheet loads -->
  <style>
    :root {
      --bg: #121418;
      --panel: #1a1e24;
      --gold: #f59e0b;
      --gold-dark: #d97706;
      --red: #ef4444;
      --green: #10b981;
      --card-bg: #21262d;
      --accent: #f59e0b;
      --accent-dark: #d97706;
      --accent-glow: rgba(245, 158, 11, 0.15);
      --text-primary: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #374151;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #root {
      min-height: 100vh;
    }
  </style>

  <!-- Load React 18 and ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Load Chart.js for analytics graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Load SheetJS for Excel exports -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- Load the unified merged CSS styles — absolute path + version bump forces fresh load -->
  <link rel="stylesheet" href="/static/style.css?v=104">
</head>

<body>
  <div id="root"></div>

  <!-- Run pre-compiled React app.js directly -->
  <script src="/static/app.js?v=10001"></script>

  <!-- Register Service Worker for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>

</html>
